* {box-sizing:border-box}
body {margin:0;color:var(--foreground, #192c20);font-family:var(--ui);line-height:1.5}
main {max-width:56rem;margin-inline:auto;display:grid;gap:.65rem}
.sheet {min-width:0;position:relative;isolation:isolate;border-radius:var(--radius,.35rem);padding:clamp(1rem,4.6vw,2.35rem);color:var(--ink);background:var(--stock);overflow:hidden}
.sheet::before {content:"";position:absolute;inset:0;z-index:-1;background:var(--paper) repeat;background-size:230px;opacity:.26;mix-blend-mode:multiply;pointer-events:none}
.cap {display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;column-gap:1rem;padding-block-end:.55rem;border-block-end:1px solid currentColor}
.cap h2,.cap span,.presets button,.entry label {font-family:var(--mono);text-transform:uppercase;font-size:.75rem;letter-spacing:.055em}
.cap h2 {font-weight:700;margin:0}.cap span {font-size:.6875rem}
.example {font-weight:400;margin:0;overflow-wrap:anywhere;white-space:pre-wrap;font-kerning:normal}
.broadside .example {font-family:Broadside,Georgia,serif;line-height:1.08;font-size:clamp(3rem,10vw,6.3rem);letter-spacing:normal}
.headline {margin-block:1.1rem .6rem;position:relative;display:grid;grid-template-columns:minmax(0,1fr) clamp(5rem,18vw,9rem);align-items:end;gap:1rem}
.headline img {align-self:end;justify-self:end;width:100%;height:auto;object-fit:contain;filter:grayscale(.9);mix-blend-mode:multiply}
.swash {background:linear-gradient(transparent 80%, #ecc655 80%, #ecc655 94%, transparent 94%);box-decoration-break:clone;-webkit-box-decoration-break:clone}
.margin {background:var(--forest);color:#f2f5d9}
.margin .cap {color:#e2edc7}
.margin .example {font-family:Margin,"Trebuchet MS",sans-serif;font-size:clamp(2.15rem,6vw,3.25rem);line-height:1.23;padding-block:.2em .3em}
.card {padding:.7rem clamp(.8rem,3.2vw,1.6rem) .85rem;border-inline-start:3px solid #a4b970;margin-block:1.05rem .15rem;color:var(--ink);background-color:var(--note);background-image:repeating-linear-gradient(transparent 0, transparent calc(1.9rem - 1px),var(--ruling) calc(1.9rem - 1px),var(--ruling) 1.9rem);background-position:0 .55rem}
.byline {display:block;font:400 1.125rem/1.4 Margin,"Trebuchet MS",sans-serif;color:#344f38}
.proofing .broadside .example {font-size:clamp(1.85rem,5.8vw,3.3rem);line-height:1.22}
.proofing .margin .example {font-size:clamp(1.5rem,4.6vw,2.35rem);line-height:1.4}
.proofing .headline {grid-template-columns:minmax(0,1fr);margin-block:1rem .3rem}
.proofing .headline img,.proofing .byline {display:none}
.pricing .byline {display:none}
.custom .headline {grid-template-columns:minmax(0,1fr)}
.custom .headline img,.custom .byline {display:none}
.entry {display:grid;gap:.6rem;padding:1rem;border:1px solid var(--border,#b2b9ac);border-radius:var(--radius,.35rem);color:var(--foreground,#192c20);background:var(--card,#fafaf4)}
.entry label {font-weight:700}
.entry input {font:400 1rem/1.5 var(--ui);padding:.65rem .8rem;border:1px solid var(--border,#7a877d);border-radius:.25rem;background:var(--background,#fff);color:var(--foreground,#192c20);width:100%}
.presets {display:flex;flex-wrap:wrap;gap:.35rem}
.presets button {min-height:2.75rem;padding:.45rem .75rem;background:transparent;color:inherit;border:1px solid var(--border,#8a9788);border-radius:2px;cursor:pointer;text-transform:none;letter-spacing:0}
.presets button[aria-pressed="true"] {background:var(--forest);color:#fff;border-color:var(--forest)}
:focus-visible {outline:3px solid var(--ring,#1b8172);outline-offset:3px}
.sr-only {position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media (max-width:460px) {
  .headline {grid-template-columns:minmax(0,1fr) 4.5rem;gap:.3rem}
  .broadside .example {font-size:clamp(2.35rem,10.6vw,3.1rem)}
  .sheet {padding:1rem}.cap span {font-size:.625rem}
}

    <p class="joins"><span>ff</span><span>fi</span><span>fl</span><span>ffi</span><span>ffl</span><span class="optional">ct</span><span>st</span></p>
  </section>
  <section class="sheet margin" aria-labelledby="margin-title">
    <header class="cap"><h2 id="margin-title">Keating Margin</h2><span>Annotation regular</span></header>
    <div class="card"><p class="example" id="margin-line">When does the paused call resume?</p><span class="byline">Quick check · Turn 8</span></div>
    <p class="joins"><span>ff</span><span>fi</span><span>fl</span><span>ffi</span><span>ffl</span></p>
  </section>
  <div class="entry">
    <label for="custom-line">Try a line in both faces</label>
    <input id="custom-line" type="text" maxlength="160" placeholder="Type your own words…" autocomplete="off">
    <div class="presets" role="group" aria-label="Type specimens">
      <button type="button" data-mode="ligatures" aria-pressed="false">Ligatures</button>
      <button type="button" data-mode="lesson" aria-pressed="true">Lesson</button>
      <button type="button" data-mode="pricing" aria-pressed="false">Pricing</button>
      <button type="button" data-mode="alphabet" aria-pressed="false">Alphabet</button>
      <button type="button" data-mode="figures" aria-pressed="false">Figures &amp; punctuation</button>
    </div>
  </div>
</main>
<script>
const proof = document.getElementById('proof');
const field = document.getElementById('custom-line');
const broadside = document.getElementById('broadside-line');
const margin = document.getElementById('margin-line');
const lessonHeadline = broadside.cloneNode(true);
const lessonNote = margin.textContent;
const buttons = Array.from(document.querySelectorAll('[data-mode]'));
const lines = {
  alphabet: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ\nabcdefghijklmnopqrstuvwxyz',
  figures: '$10.00   0123456789\n“I’ll ask again.”  Q&A?!'
};
function showSample(mode) {
  proof.classList.toggle('proofing', mode === 'alphabet' || mode === 'figures');
  proof.classList.toggle('custom', mode === 'custom');
  proof.classList.toggle('ligatures', mode === 'ligatures');
  proof.classList.toggle('pricing', mode === 'pricing');
  for (const button of buttons) {
    button.setAttribute('aria-pressed', String(button.dataset.mode === mode));
  }
  if (mode === 'lesson') {
    broadside.replaceChildren(...Array.from(lessonHeadline.cloneNode(true).childNodes));
    margin.textContent = lessonNote;
  } else if (mode === 'ligatures') {
    broadside.textContent = 'Office hours.';
    margin.textContent = 'Reflect first. Try it offline.';
  } else if (mode === 'pricing') {
    broadside.textContent = 'Plans & credits.';
    margin.textContent = '$10 of hosted AI credit';
  } else {
    const line = mode === 'custom' ? field.value : lines[mode];
    broadside.textContent = line;
    margin.textContent = line;
  }
}
for (const button of buttons) {
  button.addEventListener('click', () => {
    field.value = '';
    showSample(button.dataset.mode);
  });
}
field.addEventListener('input', () => showSample(field.value.trim() ? 'custom' : 'ligatures'));
showSample('ligatures');
</script>
