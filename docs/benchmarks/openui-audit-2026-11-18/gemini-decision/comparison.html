    <style>
      :root {

        --line: var(--border, light-dark(#c5d1c7, #425048));
        --panel: var(--card, light-dark(#f5f7f3, #222923));

        --r: var(--radius, 9px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        font: 15px/1.48 var(--font-sans, system-ui, sans-serif);
      }
      main {
        max-width: 54rem;
        margin-inline: auto;
      }
      button,
      select {
        font: inherit;
        color: inherit;
      }
      button,
      select,
      summary {
        cursor: pointer;
      }
      button:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--ring, var(--brand));
        outline-offset: 2px;
      }
      .switch {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin: 0 0 1rem;
      }
      .switch button {
        background: transparent;
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 0.32rem 0.72rem;
      }
      .switch [aria-pressed="true"] {
        background: var(--ink);
        color: var(--background, light-dark(white, #182019));
        border-color: var(--ink);

      h1,
      h2,
      h3,
      p,
      blockquote {
        margin: 0;
      }
      h2 {
        font-size: 1.16rem;

      }
      h3 {
        font-size: 1.03rem;

        margin: 0.35rem 0 0.75rem;
        font-size: 0.89rem;
      }

        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        margin: 1rem 0 0.5rem;
      }
      .score {
        padding-block: 0.1rem;
      }
      .score strong {
        display: block;
        font-size: 1.6rem;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.04em;
      }
      .score small {
        display: block;
      }
      .score span {
        font-weight: 600;
      }

        gap: 3px;
        height: 8px;
        margin: 0.4rem 0;
        color: var(--chart-1, var(--brand));
      }
      .score + .score .bars {
        color: var(--chart-2, var(--brand));
      }
      .bars i {
        flex: 1;
        background: var(--line);
        border-radius: 2px;
      }
      .bars .met {
        background: currentColor;
      }
      .bars .missing {
        background: repeating-linear-gradient(
          135deg,
          transparent 0 2px,
          var(--line) 2px 4px
        );
      }
      .gauge {
        height: 8px;
        position: relative;
        border-radius: 2px;
        background: var(--line);
        margin: 0.4rem 0;
      }
      .gauge i {
        display: block;
        height: 8px;
        background: var(--chart-1, var(--brand));
        border-radius: 2px;
      }
      .score + .score .gauge i {
        background: var(--chart-2, var(--brand));
      }
      .gauge::after {
        content: "";
        position: absolute;
        left: 60%;
        top: -3px;
        bottom: -3px;
        border-left: 2px solid var(--ink);
      }

        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem 1rem;
        margin: 1rem 0 0.6rem;
      }
      label {
        display: grid;
        gap: 0.2rem;
        flex: 1 1 9rem;
        font-size: 0.83rem;
        color: var(--soft);
        font-weight: 600;
      }

        width: 100%;
        padding: 0.42rem 0.5rem;
        border: 1px solid var(--line);
        border-radius: var(--r);
        color: var(--ink);
        background: var(--panel);
        font-weight: 500;
      }
      blockquote {
        border-inline-start: 3px solid var(--line);
        padding-inline-start: 0.7rem;
        margin: 0.8rem 0;
        font-style: italic;
      }

        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
      }
      .col {

        padding: 16px;
        background: var(--panel);
        border-radius: var(--r);
      }
      .col h3 {
        color: var(--brand);
      }
      dl {
        margin: 0.65rem 0 0;
      }
      dt {
        font-size: 0.76rem;
        margin-top: 0.38rem;
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      summary {
        margin: 0.55rem 0 0.25rem;
        color: var(--brand);
        font-weight: 600;
      }
      details > p {
        font-size: 0.88rem;
        margin: 0.38rem 0;
      }
      details ul {
        font-size: 0.88rem;
        padding-inline-start: 1.3rem;
      }
      .raw {
        font: 0.78rem/1.45 var(--font-mono, monospace);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-height: 22rem;
        overflow: auto;
      }
      code {
        overflow-wrap: anywhere;
      }
      @media (max-width: 500px) {
        .cols {
          grid-template-columns: 1fr;
        }
        .controls label {
          flex-basis: 100%;
        }
        .switch button {
          font-size: 0.86rem;
        }
        .scores {
          gap: 0.6rem;
        }
      }
      .col h3 {
        color: var(--ink);
      }
      dl {
        display: grid;
        grid-template-columns: minmax(7rem, 1fr) minmax(0, 1.1fr);
        gap: 0.3rem 0.5rem;
        align-items: baseline;
      }
      dt {
        margin: 0;
      }
      dd {
        font-size: 0.9rem;
      }
      .col details > p {
        font-size: 0.9rem;
      }
      .shared {
        margin-block: 0.65rem;
      }
      .controls label[hidden] {
        display: none;
      }
      .try {
        color: var(--brand);
        display: inline-block;
        margin-top: 0.55rem;
      }
      .try:focus-visible {
        outline: 2px solid var(--ring, var(--brand));
      }

ers + extraRidersPerBus * busesPerHour","precision":0},{"id":"available","label":"Seats available per hour","unit":"seats","expr":"busesPerHour * seatsPerBus - baseRiders - extraRidersPerBus * busesPerHour","precision":0,"emphasis":true},{"id":"loadFactor","label":"Load factor","unit":"%","expr":"(baseRiders + extraRidersPerBus * busesPerHour) / (busesPerHour * seatsPerBus) * 100","precision":1}]}],"simulationSamples":[{"id":"bus-seats-model","samples":[{"inputs":{"busesPerHour":8,"seatsPerBus":40,"baseRiders":300,"extraRidersPerBus":8},"readouts":{"capacity":320,"riders":364,"available":-44,"loadFactor":113.75}},{"inputs":{"busesPerHour":16,"seatsPerBus":40,"baseRiders":300,"extraRidersPerBus":8},"readouts":{"capacity":640,"riders":428,"available":212,"loadFactor":66.875}}]}],"reviewIssues":["checkpoint_not_interactive","checkpoint_repeated"],"directDrafts":[]},"gemini":{"source":"./turn-receipts/MiniMax-M2.7-highspeed--bus.json","decisionModel":"gemini-decision-1","offered":["concept-map","simulation"],"action":"create","guidanceDelivered":true,"compiled":["simulation"],"selected":["simulation"],"rendered":null,"reply":"released","eligibility":"released-content","completedCandidates":2,"selectedAttempt":2,"opportunityMatch":true,"opportunityMatchOnCompleted":true,"followedOffer":true,"fit":true,"note":"A valid Simulation varies frequency, bus capacity and load factor. At 40 seats per bus and 70% load, moving from the default 6 to 12 buses/hour raises offered capacity from 240 to 480 and free seats from 72 to 144. The prediction is optional exploration within the Simulation. There is no assessed checkpoint. Ninety-seven outside words add substantial prose, and the closing 'tradeoff' describes two names for capacity.","outsideWords":97,"nativePageRequested":false,"selectedText":"Here's a live model you can drive yourself — move the buses-per-hour slider and the seat numbers recompute instantly.\n\n```openui lifecycle=workspace id=bus-frequency-seats\nroot = Learning ", \"\\\"x\\\" then \\\"y\\\"\", \"nothing at all\", \"\\\"y\\\" then \\\"x\\\"\"], hint: \"Count the numbers range(len(items) - 1) actually produces.\" }\n], \"ephemeral\", \"Python loop bounds\", \"Predict, then fix and run both examples.\")\n```"},{"id":"MiniMax-M2.7-highspeed--prediction--repeat-1/1","stage":"review","requestSha256":"c81e5091904728d42e54027064539cb9262ed5b0cea9e5c6b70b38114e6a406f","jevWireSha256":"c098a90ea523fd309ae0515bf4e2afdf62056080b6a1698c13e703459540b1d7","expected":null,"jev":{"gate":"released","attempt":"pass","blockers":[]},"gemini":{"gate":"released","attempt":"pass","blockers":[]},"observation":{"status":"measured","error":null,"http":200,"reportedModel":null,"cacheFile":"decision-cache/c81e5091904728d42e54027064539cb9262ed5b0cea9e5c6b70b38114e6a406f.quota-recovery.json","wireSha256":"67627edbd4acca58dab75e316c5058b606c94325aa8da9ef51c53b33192bcc4e","responseSha256":"70a1e62d7c2afaa0795b68c11f424a6734a61df00cfe7b7dfcc1f89f4642d0e9","usage":{"inputTokens":7177,"outputTokens":0}},"learner":"A fair coin just landed heads four times. I think tails must be due. Let me make a prediction about the next flip before you explain.","draft":"Good instinct to commit to a prediction first — let's make it explicit so we can check it against the model.\n\n```openui lifecycle=ephemeral id=gamblers-fallacy-prediction\n\nroot = LearningSurface([predict], \"Predict the next flip\", \"Say what you expect before we explain why.\", \"ephemeral\")\npredict = Question([\n  { header: \"Prediction\", question: \"What is the probability that the next flip is heads?\", type: \"choice\", choices: [\"50%\", \"More than 50% — heads are due\", \"Less than 50% — tails are due\", \"25%\"], allowText: true, hint: \"Pick a number, and you can write your own if you like.\" },\n  { header: \"Reasoning\", question: \"Why? What does the four heads in a row tell you about the next flip?\", type: \"text\", hint: \"One or two sentences is plenty.\" }\n], \"ephemeral\", \"Inde               panel.append(link);
            }
            if (r.directDrafts.length) {
              const attempted = el("ul");
              for (const d of r.directDrafts) {
                const leak = d.findings.find(
                  (f) => f.id === "checkpoint_answer_leaked",
                );
                attempted.append(
                  el(
                    "li",
                    d.text +
                      (leak
                        ? " · leak score " + leak.probability.toFixed(3)
                        : ""),
                  ),
                );
              }
              panel.append(
                disclosure("Inspect the withheld drafts", attempted),
              );
            }
          } else if (view === "direct") {
            field(dl, "Exact tutor reply", c.answer);
            field(dl, "Leak check", r.leak.status);
            field(dl, "Gate disposition", r.gate);
          } else if (view === "plan") {
            field(
              dl,
              "Assessment declined",
              r.declined == null ? "Uncertain" : r.declined ? "Yes" : "No",
            );
            field(dl, "Planner offered", list(r.offered));
            field(dl, "Expected offer", status(r.offerMatches));
          } else {
            field(dl, "Gate disposition", r.gate);
            field(dl, "Attempt review", r.attempt);
            field(
              dl,
              "Blocking review checks",
              r.blockers.length
                ? r.blockers
                    .map(
                      (b) =>
                        b.id + " (" + b.status + ", " + b.probability + ")",
                    )
                    .join(", ")
                : "None",
            );
          }
        }
      }
      function draw() {
        const rows = visible();
        const [title, description] = copy[view];
        get("heading").textContent = title;
        get("description").textContent = description;
        get("tutor-label").style.display = view === "fresh" ? "" : "none";
        pick.replaceChildren();
        pick.parentElement.style.display = view === "direct" ? "none" : "";
        rows.forEach((c, i) =>
          option(
            pick,
            i,
            view === "direct"
              ? "Identical direct answer"
              : view === "fresh"
                ? (tutor.value === "all" ? tutorName(c.tutor) + " · " : "") +
                  titles[c.caseId]
                : c.id
                    .replace("MiniMax-M2.7-highspeed--", "")
                    .replaceAll("--", " · ")
                    .replaceAll("-", " "),
          ),
        );
        const scores = get("scores");
        scores.replaceChildren();
        for (const [key, label] of Object.entries(judges)) {
          if (view === "direct") {
            const block = el("div", null, "score"),
              r = rows[0][key],
              gauge = el("div", null, "gauge"),
              fill = el("i");
            fill.style.width = r.leak.probability * 100 + "%";
            gauge.setAttribute("aria-hidden", "true");
            gauge.append(fill);
            block.append(
              el("span", label),
              el("strong", r.leak.probability.toFixed(3)),
              gauge,
              el("small", "leak score · rejection threshold 0.60"),
            );
            scores.append(block);
            continue;
          }
          const eligible =
            view === "fresh"
              ? rows.filter((c) => c.cue.kind === "implicit-action")
              : rows;
          const results = eligible.map((c) =>
            !c[key] || (view !== "fresh" && (!c.jev || !c.gemini))
              ? null
              : view === "fresh"
                ? c[key].opportunityMatchOnCompleted
                : view === "plan"
                  ? c[key].offerMatches
                  : c[key].gate === "released",
          );
          const known = results.filter((v) => v != null),
            passed = known.filter(Boolean).length;
          const metric =
            view === "fresh"
              ? "matched the implied interface"
              : view === "plan"
                ? "matched the expected offer"
                : "drafts released";
          const block = el("div", null, "score"),
            bars = el("div", null, "bars");
          bars.setAttribute("aria-hidden", "true");
          for (const value of results)
            bars.append(
              el("i", null, value == null ? "missing" : value ? "met" : ""),
            );
          block.append(
            el("span", label),
            el("strong", passed + " / " + known.length),
            bars,
            el(
              "small",
              metric + " · " + (results.length - known.length) + " unobserved",
            ),
          );
          scores.append(block);
        }
        drawCase();
      }
      document.querySelectorAll("[data-view]").forEach(
        (button) =>
          (button.onclick = () => {
            view = button.dataset.view;
            document
              .querySelectorAll("[data-view]")
              .forEach((b) =>
                b.setAttribute("aria-pressed", String(b === button)),
              );
            draw();
          }),
      );
      tutor.onchange = draw;
      pick.onchange = drawCase;
      draw();
    </script>
  </body>
</html>
