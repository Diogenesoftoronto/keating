<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' blob:; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Try the MiniMax replies · Keating</title></head><body><div id="preview" role="status">Opening the offline examples…</div><noscript>Enable JavaScript to use the examples.</noscript><script id="replies" type="application/json">[{"key":"spinner","label":"Spinner prediction","note":"The tutor changes the learner’s observation from the same wedge to the colour blue. The prompt leaves the blue share unspecified, so the four fractions lack a single justified answer. The write-in field accepts a learner’s explanation. Finishing the check records a prediction in this tab without grading it.","text":"Before I explain anything, let's lock in your prediction — this is exactly the kind of thing your gut gets better at when you commit first.\n\n```openui lifecycle=ephemeral id=spinner-prediction\n\nroot = LearningSurface([predict], \"Your prediction first\", \"Commit to an answer before the explanation arrives.\", \"ephemeral\")\npredict = Question([\n  { header: \"Next spin\", question: \"A spinner is divided into equal wedges, and one colour (blue) covers some of them. The spinner just landed on a blue wedge three times in a row. What's the chance the next spin is blue?\", type: \"choice\", choices: [\"1 in 3\", \"1 in 4\", \"1 in 6\", \"1 in 8\"], allowText: true, hint: \"Write your own answer if the spinner's wedge count is something else — include how many wedges you think there are, and whether the last three spins change anything.\" }\n], \"ephemeral\", \"Probability and independence\", \"Pick or write your prediction, then say why.\")\n```","digest":"182d79320fc05bd871135f6ddf647b964c92277cb552166a633e7c16b3ab35ac","prompt":"A blue spinner landed on the same wedge three times. Let me predict the next spin before you explain what I should expect.","segments":[{"type":"text","content":"Before I explain anything, let's lock in your prediction — this is exactly the kind of thing your gut gets better at when you commit first.\n\n"},{"type":"document","document":{"schemaVersion":1,"id":"spinner-prediction","revision":0,"lifecycle":"ready","retention":"ephemeral","supportedSurfaces":["web","desktop","mobile","terminal"],"title":"Your prediction first","description":"Commit to an answer before the explanation arrives.","nodes":[{"type":"question-group","id":"predict","topic":"Probability and independence","intro":"Pick or write your prediction, then say why.","questions":[{"id":"predict-question-1","prompt":"A spinner is divided into equal wedges, and one colour (blue) covers some of them. The spinner just landed on a blue wedge three times in a row. What's the chance the next spin is blue?","kind":"choice","header":"Next spin","choices":[{"id":"predict-question-1-choice-1","label":"1 in 3"},{"id":"predict-question-1-choice-2","label":"1 in 4"},{"id":"predict-question-1-choice-3","label":"1 in 6"},{"id":"predict-question-1-choice-4","label":"1 in 8"}],"hint":"Write your own answer if the spinner's wedge count is something else — include how many wedges you think there are, and whether the last three spins change anything.","allowText":true}]}],"createdAt":"2026-11-18T14:18:00.960Z","updatedAt":"2026-11-18T14:18:00.960Z"}}]},{"key":"bus","label":"Bus frequency","note":"At 40 seats per bus, increasing frequency from 8 to 16 doubles offered capacity from 320 to 640 seats per hour. Spare seats move from a 44-seat shortfall to a 212-seat surplus. The chart initially varies extra demand. Choose “Buses per hour” under Vary to graph the requested relationship. The brief invites a prediction. The sliders work immediately, and the simulation collects no prediction to assess.","text":"Nice — that's a hands-on way to see it. Here's a live model you can drive yourself: change buses per hour (and the other assumptions) and watch seats available per hour update instantly.\n\n```openui lifecycle=ephemeral id=bus-frequency-seats\nroot = LearningSurface([model], \"Bus frequency → seats available per hour\", \"Move the sliders; the seats-available number updates as you go.\", \"ephemeral\")\nmodel = Simulation(\"bus-seats-model\", \"Hourly seats vs. hourly demand\", [\n  { id: \"busesPerHour\", label: \"Buses per hour\", unit: \"buses\", min: 1, max: 30, step: 1, value: 8 },\n  { id: \"seatsPerBus\", label: \"Seats per bus\", unit: \"seats\", min: 20, max: 80, step: 2, value: 40 },\n  { id: \"baseRiders\", label: \"Riders who ride regardless of frequency\", unit: \"riders\", min: 0, max: 600, step: 10, value: 300 },\n  { id: \"extraRidersPerBus\", label: \"Extra riders attracted per added bus\", unit: \"riders\", min: 0, max: 40, step: 1, value: 8 }\n], [\n  { id: \"capacity\", label: \"Seats offered per hour\", unit: \"seats\", expr: \"busesPerHour * seatsPerBus\", precision: 0 },\n  { id: \"riders\", label: \"Riders per hour\", unit: \"riders\", expr: \"baseRiders + extraRidersPerBus * busesPerHour\", precision: 0 },\n  { id: \"available\", label: \"Seats available per hour\", unit: \"seats\", expr: \"busesPerHour * seatsPerBus - baseRiders - extraRidersPerBus * busesPerHour\", precision: 0, emphasis: true },\n  { id: \"loadFactor\", label: \"Load factor\", unit: \"%\", expr: \"(baseRiders + extraRidersPerBus * busesPerHour) / (busesPerHour * seatsPerBus) * 100\", precision: 1 }\n], \"ephemeral\", \"First predict: if you double buses per hour from 8 to 16, will seats available per hour double too? Then move the slider and compare. Note the 'extra riders attracted per added bus' slider — if riders grow as fast as capacity, spare seats can vanish even as service improves. A negative 'seats available' means a shortfall (turn-aways).\")\n```\n\nA couple of things worth trying once you've played with it: set *extra riders per added bus* to a high value to see how demand can cancel out a service increase, and then set it to 0 to see the pure capacity effect.\n\nTell me what you find and where the number stops improving — that point is usually where the interesting policy conversation lives.","digest":"6c435829ab004a31a081a68f053f74c5fe70982980b8a17f4a8d58ed8a72f59e","prompt":"I want to change the hourly bus frequency and watch what happens to the seats available per hour. Please skip the quiz for now.","segments":[{"type":"text","content":"Nice — that's a hands-on way to see it. Here's a live model you can drive yourself: change buses per hour (and the other assumptions) and watch seats available per hour update instantly.\n\n"},{"type":"document","document":{"schemaVersion":1,"id":"bus-frequency-seats","revision":0,"lifecycle":"ready","retention":"ephemeral","supportedSurfaces":["web","desktop","mobile","terminal"],"title":"Bus frequency → seats available per hour","description":"Move the sliders; the seats-available number updates as you go.","nodes":[{"type":"simulation","id":"bus-seats-model","title":"Hourly seats vs. hourly demand","brief":"First predict: if you double buses per hour from 8 to 16, will seats available per hour double too? Then move the slider and compare. Note the 'extra riders attracted per added bus' slider — if riders grow as fast as capacity, spare seats can vanish even as service improves. A negative 'seats available' means a shortfall (turn-aways).","parameters":[{"id":"busesPerHour","label":"Buses per hour","unit":"buses","min":1,"max":30,"step":1,"value":8},{"id":"seatsPerBus","label":"Seats per bus","unit":"seats","min":20,"max":80,"step":2,"value":40},{"id":"baseRiders","label":"Riders who ride regardless of frequency","unit":"riders","min":0,"max":600,"step":10,"value":300},{"id":"extraRidersPerBus","label":"Extra riders attracted per added bus","unit":"riders","min":0,"max":40,"step":1,"value":8}],"readouts":[{"id":"capacity","label":"Seats offered per hour","unit":"seats","expr":"busesPerHour * seatsPerBus","precision":0},{"id":"riders","label":"Riders per hour","unit":"riders","expr":"baseRiders + extraRidersPerBus * busesPerHour","precision":0},{"id":"available","label":"Seats available per hour","unit":"seats","expr":"busesPerHour * seatsPerBus - baseRiders - extraRidersPerBus * busesPerHour","precision":0,"emphasis":true},{"id":"loadFactor","label":"Load factor","unit":"%","expr":"(baseRiders + extraRidersPerBus * busesPerHour) / (busesPerHour * seatsPerBus) * 100","precision":1}]}],"createdAt":"2026-11-18T14:22:21.501Z","updatedAt":"2026-11-18T14:22:21.501Z"}},{"type":"text","content":"\nA couple of things worth trying once you've played with it: set *extra riders per added bus* to a high value to see how demand can cancel out a service increase, and then set it to 0 to see the pure capacity effect.\n\nTell me what you find and where the number stops improving — that point is usually where the interesting policy conversation lives."}]}]</script><script>
