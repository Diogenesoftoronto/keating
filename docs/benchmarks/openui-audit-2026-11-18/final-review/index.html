inkle is that \"flow\" is usually *per dripper*, and a zone has many of them, so the real total is flow × number of drippers × time. I've put both on the sliders so you can see the difference between one line and a whole zone.\n\n```openui lifecycle=workspace id=drip-flow-calculator\n\nroot = LearningSurface([sim], \"Drip irrigation: how the litres add up\", \"Move the sliders, watch the bucket fill for 6 minutes.\", \"workspace\")\nsim = Simulation(\"drip-flow-calc\", \"Drip irrigation flow calculator\", [\n  { id: \"flow\", label: \"Flow per dripper\", unit: \"L/min\", min: 0.1, max: 5, step: 0.1, value: 2 },\n  { id: \"drippers\", label: \"Drippers running\", unit: \"\", min: 1, max: 100, step: 1, value: 1 }\n], [\n  { id: \"bucket\", label: \"Water in bucket after 6 min\", unit: \"L\", expr: \"flow * drippers * 6\", precision: 1, emphasis: true },\n  { id: \"hourly\", label: \"Water per hour (whole zone)\", unit: \"L/h\", expr: \"flow * drippers * 60\", precision: 0 },\n  { id: \"daily\", label: \"Water per day (whole zone)\", unit: \"L/day\", expr: \"flow * drippers * 1440\", precision: 0 },\n  { id: \"fill10\", label: \"Minutes to fill a 10 L bucket\", unit: \"min\", expr: \"10 / (flow * drippers)\", precision: 1 }\n], \"workspace\", \"Predict before you drag: how much water lands in the bucket if 20 drippers each drip 1 L/min for 6 minutes? Then set the sliders to check. The last readout changes faster than you expect when the zone is small — that is usually where the surprise in drip irrigation comes from.\")\n```\n\nA few things worth noticing as you play with it:\n\n- The three \"per hour / per day\" readouts are just the 6-minute figure scaled, so they add no new information — but they make the arithmetic of a long watering window explicit, which is where real irrigation planning happens.\n- \"Minutes to fill a 10 L bucket\" is the same information inverted. For a single dripper, 10 L takes 5 minutes; for 20 drippers it takes 15 seconds. In the field you' asoning.\")\n\n```","tools":[],"attempted":true,"components":["question-group"],"outsideWords":15,"editableCode":[],"editorOutsideWords":null,"segments":[{"type":"text","content":"Good instinct to predict first — let's commit to an answer before I explain anything.\n\n"},{"type":"document","document":{"schemaVersion":1,"id":"tile-draw-prediction","revision":0,"lifecycle":"ready","retention":"ephemeral","supportedSurfaces":["web","desktop","mobile","terminal"],"title":"Before the explanation","description":"Make a prediction, then I'll show why.","nodes":[{"type":"question-group","id":"guess","topic":"Probability of a random draw","intro":"Pick the shape you think is most likely — or write your own reasoning.","questions":[{"id":"guess-question-1","prompt":"The bag holds 4 tiles: 1 square and 3 round. You reach in and draw one tile at random. Which shape are you most likely to draw?","kind":"choice","header":"Your prediction","choices":[{"id":"guess-question-1-choice-1","label":"Square"},{"id":"guess-question-1-choice-2","label":"Round"},{"id":"guess-question-1-choice-3","label":"Both are equally likely"},{"id":"guess-question-1-choice-4","label":"There isn't enough information to say"}],"hint":"Think about how many of each shape are in the bag, not about the order they went in.","allowText":true}]}],"createdAt":"2026-11-18T00:00:00.000Z","updatedAt":"2026-11-18T00:00:00.000Z"}}],"nativeProposed":false,"words":15,"fit":null,"note":null},"receipt":"study/supplement/prediction/receipts/tile-bag--minimax--jev.json","status":"released","notice":null,"attempt":1,"classroomNotice":null,"privateDrafts":[]},{"key":"multiples-loop--minimax--jev","caseId":"multiples-loop","version":"v2.3.5","decision":"jev","prompt":"I'm learning Python. Give me a broken loop that should collect the multiples of three in [6, 5, 9]. The expected result is [6, 9]. I want to find the bug myself. No hints, please.","reply":{"id":"7a1fd59b96f8a4cd215c","text":"Here's a loop that *should* collect the multiples of three from the list, but it doesn't produce `[6, 9]`:\n\n```python\nnumbers = [6, 5, 9]\nmultiples = []\n\nfor i in range(len(numbers)):\n    if i % 3 == 0:\n        multiples.append(numbers[i])\n\nprint(multiples)\n```\n\nRun it, compare the output to the expected `[6, 9]`, and find the one line responsible. Come back with the line you think is wrong and what you think it should say.","tools":[],"attempted":false,"components":[],"outsideWords":73,"editableCode":["python"],"editorOutsideWords":51,"segments":[{"type":"text","content":"Here's a loop that *should* collect the multiples of three from the list, but it doesn't produce `[6, 9]`:\n\n```python\nnumbers = [6, 5, 9]\nmultiples = []\n\nfor i in range(len(numbers)):\n    if i % 3 == 0:\n        multiples.append(numbers[i])\n\nprint(multiples)\n```\n\nRun it, compare the output to the expected `[6, 9]`, and find the one line responsible. Come back with the line you think is wrong and what you think it should say."}],"nativeProposed":false,"words":51,"fit":null,"note":null},"receipt":"study/supplement/addendum/receipts/multiples-loop--minimax--jev.json","status":"released","notice":null,"attempt":1,"classroomNotice":null,"privateDrafts":[]},{"key":"tile-bag-confirm--minimax--jev","caseId":"tile-bag-confirm","version":"v2.3.5","decision":"jev","prompt":"My guess is round, because three of the four tiles are round.","reply":null,"receipt":"study/supplement/addendum/receipts/tile-bag-confirm--minimax--jev.json","status":"withheld","notice":"withheld","attempt":null,"classroomNotice":null,"privateDrafts":[]},{"key":"fresh--confirmation--jev","caseId":"authentic-confirmation","version":"v2.3.6","decision":"jev","prompt":"My guess is round, because three of the four tiles are round.","reply":{"id":"860c15c6a982fcde6852","text":"Exactly—your reasoning is correct. Each tile is equally likely to be drawn, and 3 of the 4 are round, so\n\n\\[\nP(\\text{round})=\\frac{3}{4}=75\\%.\n\\]\n\nThe chance of drawing the square is only \\(\\frac{1}{4}=25\\%\\).","tools":[],"attempted":false,"components":[],"outsideWords":32,"editableCode":[],"editorOutsideWords":null,"segments":[{"type":"text","content":"Exactly—your reasoning is correct. Each tile is equally likely to be drawn, and 3 of the 4 are round, so\n\n\\[\nP(\\text{round})=\\frac{3}{4}=75\\%.\n\\]\n\nThe chance of drawing the square is only \\(\\frac{1}{4}=25\\%\\)."}],"nativeProposed":false,"words":null,"fit":null,"note":null},"receipt":"study/feedback-v2.3.6/receipts/fresh--confirmation--jev.json","status":"released","notice":null,"attempt":3,"classroomNotice":null,"privateDrafts":[]},{"key":"fresh--confirmation--google","caseId":"authentic-confirmation","version":"v2.3.6","decision":"google","prompt":"My guess is round, because three of the four tiles are round.","reply":{"id":"fd66a51a2eb2923d33df","text":"Your reasoning is exactly right, and for exactly the reason you gave. With 3 round and 1 square, P(round) = 3/4 and P(square) = 1/4 — the shape with more copies is more likely to come out. Two things worth keeping sharp:\n\n- **Order doesn't matter.** You dropped the square in first, then three rounds. Random drawing doesn't remember the order, only the counts. So \"square went in first\" gives it no advantage or disadvantage.\n- **\"Most likely\" isn't \"certain.\"** Round is 3 times as likely as square, but a square is still perfectly possible on any given draw — about 1 draw in 4.\n\nNow let's make the relationship movable rather than just stated.","tools":[{"name":"interactive_page","arguments":{"title":"Tiles in a bag: draw probability model","description":"A slider model of drawing one tile at random from a bag. Adjust how many round and square tiles are in the bag and how many times you draw. The readouts show the probability of drawing a round tile, the probability of drawing a square tile, and the expected number of squares across a number of draws, all updating instantly.","purpose":"explore","html":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e\n\u003cstyle\u003e\n  :root { color-scheme: light dark; }\n  body { margin: 0; padding: 4px 2px; font-family: var(--font-sans, system-ui, sans-serif); color: var(--foreground); background: transparent; }\n  .panel { background: var(--card); color: var(--card-foreground); border: 1px solid var(--border); border-radius: var(--radius, 10px); padding: 14px 16px; margin-bottom: 12px; }\n  h2 { margin: 0 0 10px; font-size: 1rem; }\n  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; }\n  label { font-weight: 600; font-size: 0.92rem; }\n  .val { font-family: var(--font-mono, monospace); font-size: 0.92rem; color: var(--muted-foreground); }\n  input[type=range] { width: 100%; }\n  .bag { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }\n  .tile { width: 22px; height: 22px; border: 2px solid var(--foreground); }\n  .tile.round { border-radius: 50%; }\n  .tile.square { border-radius: 3px; }\n  .readout { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; border-bottom: 1px dashed var(--border); }\n  .readout:last-child { border-bottom: none; }\n  .readout .k { font-size: 0.9rem; color: var(--muted-foreground); }\n  .readout .v { font-family: var(--font-mono, monospace); font-size: 1.05rem; font-weight: 700; }\n  .bar { height: 12px; border-radius: 6px; overflow: hidden; display: flex; margin-top: 8px; border: 1px solid var(--border); }\n  .bar span { display: block; height: 100%; }\n  .bar .r { background: var(--chart-2); }\n  .bar .s { background: var(--chart-1); }\n  .legend { display: flex; gap: 14px; font-size: 0.8rem; margin-top: 6px; color: var(--muted-foreground); }\n  .note { font-size: 0.85rem; color: var(--muted-foreground); margin-top: 10px; }\n  button { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--primary); color: var(--primary-foreground); cursor: pointer; }\n  button:focus-visible, input:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }\n  .live { position: absolute; left: -9999px; }\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cdiv class=\"panel\"\u003e\n  \u003ch2\u003eThe bag\u003c/h2\u003e\n  \u003cdiv class=\"row\"\u003e\u003clabel for=\"round\"\u003eRound tiles\u003c/label\u003e\u003cspan class=\"val\" id=\"roundVal\"\u003e3\u003c/span\u003e\u003c/div\u003e\n  \u003cinput type=\"range\" id=\"round\" min=\"0\" max=\"20\" step=\"1\" value=\"3\"\u003e\n  \u003cdiv class=\"row\"\u003e\u003clabel for=\"square\"\u003eSquare tiles\u003c/label\u003e\u003cspan class=\"val\" id=\"squareVal\"\u003e1\u003c/span\u003e\u003c/div\u003e\n  \u003cinput type=\"range\" id=\"square\" min=\"1\" max=\"20\" step=\"1\" value=\"1\"\u003e\n  \u003cdiv class=\"row\"\u003e\u003clabel for=\"draws\"\u003eDraws (replace each time)\u003c/label\u003e\u003cspan class=\"val\" id=\"drawsVal\"\u003e1\u003c/span\u003e\u003c/div\u003e\n  \u003cinput type=\"range\" id=\"draws\" min=\"1\" max=\"20\" step=\"1\" value=\"1\"\u003e\n  \u003cdiv class=\"bag\" id=\"bag\" aria-hidden=\"true\"\u003e\u003c/div\u003e\n\u003c/div\u003e\n\n\u003cdiv class=\"panel\"\u003e\n  \u003ch2\u003eReadouts\u003c/h2\u003e\n  \u003cdiv class=\"readout\"\u003e\u003cspan class=\"k\"\u003eP(round) on one draw\u003c/span\u003e\u003cspan class=\"v\" id=\"pRound\"\u003e—\u003c/span\u003e\u003c/div\u003e\n  \u003cdiv class=\"readout\"\u003e\u003cspan class=\"k\"\u003eP(square) on one draw\u003c/span\u003e\u003cspan class=\"v\" id=\"pSq\"\u003e—\u003c/span\u003e\u003c/div\u003e\n  \u003cdiv class=\"readout\"\u003e\u003cspan class=\"k\"\u003eExpected squares in \u003cspan id=\"drawsIn\"\u003e1\u003c/span\u003e draw(s)\u003c/span\u003e\u003cspan class=\"v\" id=\"expSq\"\u003e—\u003c/span\u003e\u003c/div\u003e\n  \u003cdiv class=\"bar\"\u003e\u003cspan class=\"r\" id=\"barR\"\u003e\u003c/span\u003e\u003cspan class=\"s\" id=\"barS\"\u003e\u003c/span\u003e\u003c/div\u003e\n  \u003cdiv class=\"legend\"\u003e\u003cspan\u003e■ round\u003c/span\u003e\u003cspan\u003e■ square\u003c/span\u003e\u003c/div\u003e\n  \u003cp class=\"note\"\u003eExpected squares is the long-run average, not a promise: with 4 draws you might get 0, 1, or 2 squares, and the average across many repeats is what this shows.\u003c/p\u003e\n\u003c/div\u003e\n\n\u003cdiv class=\"panel\"\u003e\n  \u003ch2\u003eTry it\u003c/h2\u003e\n  \u003cp class=\"note\" id=\"prompt\"\u003ePredict first: if you add round tiles, what happens to P(square) — and does it ever reach zero?\u003c/p\u003e\n  \u003cbutton type=\"button\" id=\"share\"\u003eShare what I found\u003c/button\u003e\n  \u003cp class=\"note\" id=\"sent\" role=\"status\" aria-live=\"polite\"\u003e\u003c/p\u003e\n\u003c/div\u003e\n\n\u003cscript\u003e\n  const $ = id =\u003e document.getElementById(id);\n  const roundEl = $('round'), squareEl = $('square'), drawsEl = $('draws');\n  function pct(x){ return (x*100).toFixed(1).replace(/\\.0$/,'') + '%'; }\n  function render(){\n    const r = +roundEl.value, s = +squareEl.value, n = +drawsEl.value;\n    const t = r + s;\n    const pR = r/t, pS = s/t;\n    $('roundVal').textContent = r;\n    $('squareVal').textContent = s;\n    $('drawsVal').textContent = n;\n    $('drawsIn').textContent = n;\n    $('pRound').textContent = pct(pR);\n    $('pSq').textContent = pct(pS);\n    $('expSq').textContent = (n*pS).toFixed(2).replace(/\\.?0+$/,'');\n    $('barR').style.width = (pR*100)+'%';\n    $('barS').style.width = (pS*100)+'%';\n    const bag = $('bag'); bag.innerHTML='';\n    for(let i=0;i\u003cr;i++){ const d=document.createElement('div'); d.className='tile round'; bag.appendChild(d); }\n    for(let i=0;i\u003cs;i++){ const d=document.createElement('div'); d.className='tile square'; bag.appendChild(d); }\n  }\n  [roundEl,squareEl,drawsEl].forEach(e=\u003ee.addEventListener('input',render));\n  render();\n  $('share').addEventListener('click', async () =\u003e {\n    const r = +roundEl.value, s = +squareEl.value, n = +drawsEl.value, t = r+s;\n    const summary = `I set the bag to ${r} round and ${s} square tile(s), drew ${n} time(s). P(round) came out ${pct(r/t)} and P(square) ${pct(s/t)}; expected squares in ${n} draw(s) was ${(n*s/t).toFixed(2)}.`;\n    $('sent').textContent = 'Sending…';\n    const res = await keating.share({ summary, data: { roundTiles:r, squareTiles:s, draws:n, pRound:r/t, pSquare:s/t, expectedSquares:n*s/t } });\n    $('sent').textContent = res \u0026\u0026 res.ok ? 'Sent to your tutor.' : 'Could not send that — try again.';\n  });\n  keating.ready();\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e"}}],"attempted":false,"components":[],"outsideWords":115,"editableCode":[],"editorOutsideWords":null,"segments":[{"type":"text","content":"Your reasoning is exactly right, and for exactly the reason you gave. With 3 round and 1 square, P(round) = 3/4 and P(square) = 1/4 — the shape with more copies is more likely to come out. Two things worth keeping sharp:\n\n- **Order doesn't matter.** You dropped the square in first, then three rounds. Random drawing doesn't remember the order, only the counts. So \"square went in first\" gives it no advantage or disadvantage.\n- **\"Most likely\" isn't \"certain.\"** Round is 3 times as likely as square, but a square is still perfectly possible on any given draw — about 1 draw in 4.\n\nNow let's make the relationship movable rather than just stated."}],"nativeProposed":true,"words":null,"fit":null,"note":null},"receipt":"study/feedback-v2.3.6/receipts/fresh--confirmation--google.json","status":"released","notice":null,"attempt":1,"classroomNotice":null,"privateDrafts":[]},{"key":"classroom-tile-confirm--minimax--jev","caseId":"classroom-confirmation","version":"v2.3.7","decision":"jev","prompt":"My guess is round, because three of the four tiles are round.","reply":null,"receipt":"study/classroom-v2.3.7/receipts/classroom-tile-confirm--minimax--jev.json","status":"withheld","notice":"withheld","attempt":null,"classroomNotice":"Couldn't produce a reply","privateDrafts":[{"number":1,"text":"Exactly right — and your reasoning names the mechanism: probability here comes from **how many** tiles of each shape are in the bag, not from the order they went in.\n\nDrawing one tile at random means every tile is equally likely to be the one you pull:\n\n- Round: 3 of 4 tiles → **3/4 (75%)**\n- Square: 1 of 4 tiles → **1/4 (25%)**\n\nOne nuance worth holding onto: the \"drop one square, *then* add three round\" sequence matters for nothing statistically. A bag doesn't remember order. If the tiles got jumbled in a bag, the order of insertion is irrelevant — only the counts are. (Order would only matter if you drew tiles one at a time *without* replacing them, which is a different experiment — and then you'd be far more likely to end up with round tiles overall too, since you're exhausting the bag.)\n\nSo: round is your best single guess, and it's a 3-to-1 edge over square.\n\nLet me let you push on that number to check you believe it:","complete":false,"stop":"length","status":"generation-error","tools":["interactive_page"],"checks":[]}]},{"key":"classroom-tile-linked-feedback--minimax--jev","caseId":"classroom-confirmation","version":"v2.3.8","decision":"jev","prompt":"My guess is round, because three of the four tiles are round.","reply":null,"receipt":"study/classroom-v2.3.8/receipts/classroom-tile-linked-feedback--minimax--jev.json","status":"withheld","notice":"withheld","attempt":null,"classroomNotice":"Couldn't produce a reply","privateDrafts":[{"number":1,"text":"Exactly right. Three of the four tiles are round, so P(round) = 3/4 = 75%. Each tile is equally likely to be drawn, so the most common shape wins — the order you dropped them in is irrelevant.\n\nA useful next check: what if you added one more square tile?\n\n```openui lifecycle=ephemeral id=tile-draw-new-square\n\nroot = LearningSurface([q], \"Add a square\", \"Predict the new odds before you look.\", \"ephemeral\")\nq = Question([{ header: \"New bag\", question: \"The bag now holds 5 tiles: 2 square and 3 round. Which shape is more likely to be drawn?\", type: \"choice\", choices: [\"Square\", \"Round\", \"Both are equally likely\"], allowText: true, hint: \"Compare the counts, then convert each to a fraction of 5.\" }], \"ephemeral\", \"Probability of a random draw\", \"Weigh the two counts against each other.\")\n\n```","complete":true,"stop":"stop","status":"fail","tools":[],"checks":[{"name":"checkpoint_answer_leaked","status":"fail","probability":0.77},{"name":"checkpoint_repeated","status":"unknown","probability":0.59},{"name":"checkpoint_continued","status":"unknown","probability":0.48},{"name":"unsolicited_assessment","status":"unknown","probability":0.52}]},{"number":2,"text":"Your guess is right — and your reasoning is exactly the right reasoning.\n\n**Why round wins:** with 4 tiles in the bag, 3 of them are round, so a random draw lands on round with probability 3/4 = 75%, and on square with probability 1/4 = 25%. Round is three times as likely.\n\n**The part that often trips people up:** the *order* you put the tiles in doesn't matter. \"I dropped the square in first, so it's at the bottom\" and \"the round ones are on top\" would only matter if you grabbed from the top without mixing. A random draw treats every tile as equally likely regardless of position or insertion order. If instead you pulled a tile off the top of the bag, then order *would* matter — and round would be even more likely. So your answer was right under the harder assumption.\n\n**The general rule to carry forward:** probability = (number of favorable outcomes) ÷ (number of equally likely outcomes). The size, shape, or color of the other tiles is irrelevant; only how many of them there are and how many are the one you want.\n\nOne more twist worth knowing: this only works because all four tiles are *equally likely* to be picked. If one tile were much bigger than the others, or if you were picking by feel through a cloth bag, the \"equal likelihood\" assumption would break and the simple count would no longer guarantee round is most likely.\n\nWant me to run a quick simulation of random draws so you can see the ~3-in-4 pattern settle in empirically?","complete":true,"stop":"stop","status":"fail","tools":[],"checks":[{"name":"mastery_overclaimed","status":"unknown","probability":0.48},{"name":"checkpoint_repeated","status":"unknown","probability":0.41},{"name":"checkpoint_continued","status":"unknown","probability":0.58},{"name":"checkpoint_not_interactive","status":"unknown","probability":0.57},{"name":"unsolicited_animation","status":"fail","probability":0.64},{"name":"quality_scope","status":"unknown","probability":0.6599999999999999}]},{"number":3,"text":"Correct. Your reasoning matches the sample space: 3 of the 4 tiles are round, so the probability of drawing round is **3/4 (75%)**, while square is **1/4 (25%)**. Therefore, round is three times as likely as square.","complete":true,"stop":"stop","status":"unknown","tools":[],"checks":[{"name":"mastery_overclaimed","status":"unknown","probability":0.5},{"name":"checkpoint_repeated","status":"unknown","probability":0.42},{"name":"checkpoint_continued","status":"unknown","probability":0.57}]}]}]}},{"key":"classroom-stage-light","digest":"489f6760","segments":[{"type":"document","document":{"schemaVersion":1,"id":"flash-rate-sim","revision":0,"lifecycle":"ready","retention":"ephemeral","supportedSurfaces":["web","desktop","mobile","terminal"],"title":"Flashes in 12 seconds","description":"Drag the flash rate and watch the 12-second total update.","nodes":[{"type":"simulation","id":"flash-sim","title":"Stage light flash counter","brief":"Move the flash rate slider and watch how the number of flashes in 12 s
