<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' blob:; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>MiniMax with Gemini Decision · Keating</title></head><body><div id="preview" role="status">Opening the offline examples…</div><noscript>Enable JavaScript to use the examples.</noscript><script id="replies" type="application/json">[{"key":"spinner","label":"Spinner prediction","prompt":"A blue spinner landed on the same wedge three times. Let me predict the next spin before you explain what I should expect.","targets":["Question"],"draft":2,"model":"MiniMax-M2.7-highspeed","judge":"gemini-decision-1","text":"Good — prediction first. Before I explain anything, here's what I want to know.\n\n```openui lifecycle=ephemeral id=spinner-prediction\n\nroot = LearningSurface([predict], \"Before I explain\", \"Give me your prediction and your reasoning. I won't judge either until you commit.\", \"ephemeral\")\npredict = Question([\n  { header: \"Prediction\", question: \"The blue spinner has landed on the same blue wedge three times in a row. What do you predict for the next spin?\", type: \"choice\", choices: [\"Blue again\", \"Not blue\", \"Not sure — I'd want to see the spinner first\"], allowText: true, hint: \"Pick a side, and add your reasoning in the text box.\" },\n  { header: \"The setup\", question: \"Roughly how many wedges does the spinner have, and how many of them are blue?\", type: \"text\", hint: \"For example: '6 wedges, 2 blue'. A guess is fine.\" }\n], \"ephemeral\", \"Spinner prediction\", \"Two quick prompts, then I'll explain what the evidence does and doesn't tell you.\")\n```","digest":"55ed6b7a993b725063fee3f284a23fa97716b30c8978bcb6627a8f65506e6cba","segments":[{"type":"text","content":"Good — prediction first. Before I explain anything, here's what I want to know.\n\n"},{"type":"document","document":{"schemaVersion":1,"id":"spinner-prediction","revision":0,"lifecycle":"ready","retention":"ephemeral","supportedSurfaces":["web","desktop","mobile","terminal"],"title":"Before I explain","description":"Give me your prediction and your reasoning. I won't judge either until you commit.","nodes":[{"type":"question-group","id":"predict","topic":"Spinner prediction","intro":"Two quick prompts, then I'll explain what the evidence does and doesn't tell you.","questions":[{"id":"predict-question-1","prompt":"The blue spinner has landed on the same blue wedge three times in a row. What do you predict for the next spin?","kind":"choice","header":"Prediction","choices":[{"id":"predict-question-1-choice-1","label":"Blue again"},{"id":"predict-question-1-choice-2","label":"Not blue"},{"id":"predict-question-1-choice-3","label":"Not sure — I'd want to see the spinner first"}],"hint":"Pick a side, and add your reasoning in the text box.","allowText":true},{"id":"predict-question-2","prompt":"Roughly how many wedges does the spinner have, and how many of them are blue?","kind":"text","header":"The setup","hint":"For example: '6 wedges, 2 blue'. A guess is fine."}]}],"createdAt":"2026-11-18T15:40:01.043Z","updatedAt":"2026-11-18T15:40:01.043Z"}}],"outsideWords":14,"trimmedWords":24,"note":"The grouped Question gives the learner a choice or write-in prediction before the explanation. A second prompt asks about spinner geometry without revealing the result. The tutor changes 'same wedge' to 'same blue wedge' and invites the learner to guess the missing counts. Fourteen outside words precede the checkpoint."},{"key":"bus","label":"Bus frequency","prompt":"I want to change the hourly bus frequency and watch what happens to the seats available per hour. Please skip the quiz for now.","targets":["Simulation","ConceptMap"],"draft":2,"model":"MiniMax-M2.7-highspeed","judge":"gemini-decision-1","text":"Here's a live model you can drive yourself — move the buses-per-hour slider and the seat numbers recompute instantly.\n\n```openui lifecycle=workspace id=bus-frequency-seats\nroot = LearningSurface([sim], \"Bus frequency and seats per hour\", \"Change the hourly frequency and watch seat supply.\", \"workspace\")\nsim = Simulation(\"bus-sim\", \"Hourly bus frequency vs. seats per hour\", [\n  { id: \"freq\", label: \"Buses per hour\", unit: \"buses\", min: 1, max: 30, step: 1, value: 6 },\n  { id: \"seats\", label: \"Seats per bus\", unit: \"seats\", min: 10, max: 60, step: 2, value: 40 },\n  { id: \"load\", label: \"Average load factor\", unit: \"%\", min: 0, max: 100, step: 5, value: 70 }\n], [\n  { id: \"capacity\", label: \"Seats offered per hour\", unit: \"seats\", expr: \"freq * seats\", precision: 0 },\n  { id: \"occupied\", label: \"Occupied seats per hour\", unit: \"seats\", expr: \"freq * seats * load / 100\", precision: 0 },\n  { id: \"available\", label: \"Seats available per hour (unoccupied)\", unit: \"seats\", expr: \"freq * seats * (100 - load) / 100\", precision: 0, emphasis: true }\n], \"workspace\", \"Predict first: if you double the buses per hour, what do you expect the emphasized readout (seats available per hour) to do — and why? Then move the frequency slider and compare. Note there are two readings of 'seats available': seats offered per hour (capacity) and seats actually free once the load factor is applied. Watch both, and try raising the load factor while you hold frequency steady to see what happens to free seats.\")\n```\n\nTwo things worth trying once it's live: raise the load factor at a fixed frequency (free seats shrink without any schedule change), and then restore the load and push frequency up (seats offered rise, but so does total capacity — which is the tradeoff behind frequency decisions). Press **Share what I found** when you've got settings you want me to look at, and tell me what you predicted first so I can check the model against your reasoning.","digest":"20546cc7902d1855d42c6007d46570a41b3fd20b3537c2fa627d49c999b731fb","segments":[{"type":"text","content":"Here's a live model you can drive yourself — move the buses-per-hour slider and the seat numbers recompute instantly.\n\n"},{"type":"document","document":{"schemaVersion":1,"id":"bus-frequency-seats","revision":0,"lifecycle":"ready","retention":"workspace","supportedSurfaces":["web","desktop","mobile","terminal"],"title":"Bus frequency and seats per hour","description":"Change the hourly frequency and watch seat supply.","nodes":[{"type":"simulation","id":"bus-sim","title":"Hourly bus frequency vs. seats per hour","brief":"Predict first: if you double the buses per hour, what do you expect the emphasized readout (seats available per hour) to do — and why? Then move the frequency slider and compare. Note there are two readings of 'seats available': seats offered per hour (capacity) and seats actually free once the load factor is applied. Watch both, and try raising the load factor while you hold frequency steady to see what happens to free seats.","parameters":[{"id":"freq","label":"Buses per hour","unit":"buses","min":1,"max":30,"step":1,"value":6},{"id":"seats","label":"Seats per bus","unit":"seats","min":10,"max":60,"step":2,"value":40},{"id":"load","label":"Average load factor","unit":"%","min":0,"max":100,"step":5,"value":70}],"readouts":[{"id":"capacity","label":"Seats offered per hour","unit":"seats","expr":"freq * seats","precision":0},{"id":"occupied","label":"Occupied seats per hour","unit":"seats","expr":"freq * seats * load / 100","precision":0},{"id":"available","label":"Seats available per hour (unoccupied)","unit":"seats","expr":"freq * seats * (100 - load) / 100","precision":0,"emphasis":true}]}],"createdAt":"2026-11-18T15:40:34.827Z","updatedAt":"2026-11-18T15:40:34.827Z"}},{"type":"text","content":"\nTwo things worth trying once it's live: raise the load factor at a fixed frequency (free seats shrink without any schedule change), and then restore the load and push frequency up (seats offered rise, but so does total capacity — which is the tradeoff behind frequency decisions). Press **Share what I found** when you've got settings you want me to look at, and tell me what you predicted first so I can check the model against your reasoning."}],"outsideWords":97,"trimmedWords":0,"note":"A valid Simulation varies frequency, bus capacity and load factor. At 40 seats per bus and 70% load, moving from the default 6 to 12 buses/hour raises offered capacity from 240 to 480 and free seats from 72 to 144. The prediction is optional exploration within the Simulation. There is no assessed checkpoint. Ninety-seven outside words add substantial prose, and the closing 'tradeoff' describes two names for capacity."}]</script><script>
