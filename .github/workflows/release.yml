name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      apple_signing: ${{ steps.signing.outputs.apple_signing }}

    steps:
      - uses: actions/checkout@v6

      - name: Check optional Apple signing availability
        id: signing
        env:
          CERTIFICATE: ${{ secrets.KEATING_APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.KEATING_APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ACCOUNT: ${{ secrets.KEATING_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.KEATING_APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM: ${{ secrets.KEATING_APPLE_TEAM_ID }}
        run: |
          COUNT=0
          for name in CERTIFICATE CERTIFICATE_PASSWORD APPLE_ACCOUNT APPLE_PASSWORD APPLE_TEAM; do
            if [ -n "${!name}" ]; then COUNT=$((COUNT + 1)); fi
          done
          if [ "$COUNT" -eq 0 ]; then
            echo 'apple_signing=false' >> "$GITHUB_OUTPUT"
            echo 'macOS desktop omitted: Apple signing credentials are not configured. No unsigned installer will be published.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$COUNT" -eq 5 ]; then
            echo 'apple_signing=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Incomplete Apple signing configuration; refusing release.' >&2
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd spikes/flue-host
          bun install --frozen-lockfile
          cd ../../web
          bun install --frozen-lockfile

      - name: Verify tag and synchronized versions
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "${TAG_VERSION}" = "${PACKAGE_VERSION}"
          bun scripts/sync-version.ts --check

      - name: Test and build
        run: |
          bun run build
          bun test ./test/*.test.ts
          cd web
          bun test

      - name: Verify npm package contents
        run: |
          npm pack --ignore-scripts --dry-run --json > npm-pack.json
          node scripts/verify-package-manifest.mjs npm-pack.json

  build:
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: x64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: x64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Build
        run: |
          bun install --frozen-lockfile
          bun scripts/sync-version.ts --check
          bun x tsc -p tsconfig.json
          bun scripts/copy-core-templates.ts

      - name: Create bundle
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          BUNDLE_NAME="keating-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}"
          STAGE_DIR="${BUNDLE_NAME}"
          mkdir -p "${STAGE_DIR}"
          mkdir -p "${STAGE_DIR}/bin"
          mkdir -p "${STAGE_DIR}/runtime"
          cp bin/keating.js "${STAGE_DIR}/bin/"
          cp "$(command -v bun)" "${STAGE_DIR}/runtime/bun"
          chmod +x "${STAGE_DIR}/runtime/bun"
          cp -r dist pi scripts/install "${STAGE_DIR}/"
          cp package.json SYSTEM.md "${STAGE_DIR}/"
          # Bundle node_modules so the tarball is truly standalone
          cp -r node_modules "${STAGE_DIR}/"
          mv "${STAGE_DIR}/install/install.sh" "${STAGE_DIR}/install.sh"
          rm -rf "${STAGE_DIR}/install"
          tar -czf "${BUNDLE_NAME}.tar.gz" "${STAGE_DIR}"

      - name: Verify bundle contents
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          BUNDLE_NAME="keating-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}"
          tar -tzf "${BUNDLE_NAME}.tar.gz" > bundle-files.txt
          grep -Fx "${BUNDLE_NAME}/bin/keating.js" bundle-files.txt
          grep -Fx "${BUNDLE_NAME}/dist/src/cli/main.js" bundle-files.txt
          grep -Fx "${BUNDLE_NAME}/dist/src/pi/hyper-teacher/index.js" bundle-files.txt
          grep -Fx "${BUNDLE_NAME}/dist/src/runtime/teaching-episode-child.js" bundle-files.txt
          grep -Fx "${BUNDLE_NAME}/dist/shared/evolution/loop.js" bundle-files.txt
          grep -Fx "${BUNDLE_NAME}/SYSTEM.md" bundle-files.txt
          grep -Fx "${BUNDLE_NAME}/runtime/bun" bundle-files.txt
          if grep -F "${BUNDLE_NAME}/bin/.keating/" bundle-files.txt; then exit 1; fi
          if grep -F "${BUNDLE_NAME}/bin/keating.config.json" bundle-files.txt; then exit 1; fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keating-${{ matrix.os }}-${{ matrix.arch }}
          path: keating-*.tar.gz

  build-desktop-linux:
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x64
            edition: standard
            runner: ubuntu-latest
            deb_arch: amd64
            rpm_arch: x86_64
            appimage_arch: x86_64
          - arch: arm64
            edition: standard
            runner: ubuntu-24.04-arm
            deb_arch: arm64
            rpm_arch: aarch64
            appimage_arch: arm64
          - arch: x64
            edition: offline
            runner: ubuntu-latest
            deb_arch: amd64
            rpm_arch: x86_64
            appimage_arch: x86_64
          - arch: arm64
            edition: offline
            runner: ubuntu-24.04-arm
            deb_arch: arm64
            rpm_arch: aarch64
            appimage_arch: arm64
    env:
      # Use native FPM on both runners; the builder's bundled FPM is x64-only.
      USE_SYSTEM_FPM: 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm ruby-dev build-essential cmake libvulkan1
          sudo gem install --no-document fpm -v 1.16.0

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --cwd spikes/flue-host --frozen-lockfile
          bun install --cwd web --frozen-lockfile

      - name: Build desktop runtime
        run: |
          bun scripts/sync-version.ts --check
          bun run --cwd desktop setup:electron
          bun run --cwd desktop build:main

      - name: Package Linux desktop
        run: |
          if [ "${{ matrix.edition }}" = offline ]; then
            bun run --cwd desktop dist:offline --linux AppImage deb rpm --${{ matrix.arch }} --publish never
          else
            bun run --cwd desktop dist:linux --${{ matrix.arch }} --publish never
          fi

      - name: Verify package outputs
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PREFIX="desktop/release/Keating-${VERSION}-linux"
          if [ "${{ matrix.edition }}" = offline ]; then
            PREFIX="desktop/release-offline/Keating-${VERSION}-offline-linux"
          fi
          test -s "${PREFIX}-${{ matrix.appimage_arch }}.AppImage"
          test -s "${PREFIX}-${{ matrix.deb_arch }}.deb"
          test -s "${PREFIX}-${{ matrix.rpm_arch }}.rpm"
          dpkg-deb --info "${PREFIX}-${{ matrix.deb_arch }}.deb"
          rpm -qip "${PREFIX}-${{ matrix.rpm_arch }}.rpm"

      - name: Upload Linux desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: keating-desktop-linux-${{ matrix.arch }}-${{ matrix.edition }}
          if-no-files-found: error
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.rpm
            desktop/release-offline/*.AppImage
            desktop/release-offline/*.deb
            desktop/release-offline/*.rpm

  build-desktop-macos:
    needs: validate
    if: ${{ needs.validate.outputs.apple_signing == 'true' }}
    # LiteRT currently ships a macOS arm64 library only; never bundle an
    # arm64 native runtime into an Intel installer.
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CSC_LINK: ${{ secrets.KEATING_APPLE_CERTIFICATE_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.KEATING_APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.KEATING_APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.KEATING_APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.KEATING_APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v6
      - name: Require Apple Developer ID signing and notarization credentials
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then echo "Missing Apple release credential: ${name}" >&2; exit 1; fi
          done
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --cwd spikes/flue-host --frozen-lockfile
          bun install --cwd web --frozen-lockfile
      - name: Build, sign, and notarize macOS desktop
        run: |
          bun scripts/sync-version.ts --check
          bun run --cwd desktop setup:electron
          bun run --cwd desktop build:main
          bun run --cwd desktop dist:mac --publish never
      - name: Verify Developer ID, notarization ticket, and native runtime
        run: |
          APP="desktop/release/mac-arm64/Keating.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2> "$RUNNER_TEMP/keating-signature.txt"
          grep -F 'Authority=Developer ID Application:' "$RUNNER_TEMP/keating-signature.txt"
          grep -Fx "TeamIdentifier=$APPLE_TEAM_ID" "$RUNNER_TEMP/keating-signature.txt"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"
          "$APP/Contents/Resources/offline/keating-offline" --probe
          VERSION="${GITHUB_REF_NAME#v}"
          test -s "desktop/release/Keating-${VERSION}-macos-arm64.dmg"
          test -s "desktop/release/Keating-${VERSION}-macos-arm64.zip"
          codesign --verify --verbose=2 "desktop/release/Keating-${VERSION}-macos-arm64.dmg"
          # Staple the distributed disk image as well as the enclosed app.
          xcrun notarytool submit "desktop/release/Keating-${VERSION}-macos-arm64.dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "desktop/release/Keating-${VERSION}-macos-arm64.dmg"
          xcrun stapler validate "desktop/release/Keating-${VERSION}-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: keating-desktop-macos-arm64
          if-no-files-found: error
          path: |
            desktop/release/Keating-*-macos-arm64.dmg
            desktop/release/Keating-*-macos-arm64.zip

  build-native:
    needs: validate
    uses: ./.github/workflows/native-downloads.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets: inherit

  release:
    needs: [validate, build, build-desktop-linux, build-desktop-macos, build-native]
    # An intentionally omitted desktop platform must not suppress the release;
    # configured builds and signing failures must still block publication.
    if: ${{ always() && needs.validate.result == 'success' && needs.build.result == 'success' && needs.build-desktop-linux.result == 'success' && needs.build-native.result == 'success' && (needs.build-desktop-macos.result == 'success' || needs.build-desktop-macos.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      GNUPGHOME: ${{ github.workspace }}/.keating-release-signing
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install Linux signing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gpg rpm

      - name: Prepare pinned release signing key
        env:
          KEATING_RELEASE_SIGNING_KEY: ${{ secrets.KEATING_RELEASE_SIGNING_KEY }}
          KEATING_RELEASE_SIGNING_PASSPHRASE: ${{ secrets.KEATING_RELEASE_SIGNING_PASSPHRASE }}
        run: node desktop/scripts/prepare-release-signing.mjs

      - name: Sign Linux installers and verify the complete artifact manifest
        env:
          KEATING_RELEASE_SIGNING_PASSPHRASE: ${{ secrets.KEATING_RELEASE_SIGNING_PASSPHRASE }}
        run: node desktop/scripts/sign-release.mjs --artifacts artifacts --rpm-sign

      - name: Remove private signing material
        if: always()
        run: |
          gpgconf --kill gpg-agent || true
          rm -rf "$GNUPGHOME"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.apk
            artifacts/**/*.asc
            artifacts/SHA256SUMS
            web/public/keating-metaharness.pdf
          generate_release_notes: true

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node for npm trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Build
        run: |
          bun install --frozen-lockfile
          cd spikes/flue-host
          bun install --frozen-lockfile
          cd ../../web
          bun install --frozen-lockfile
          cd ..
          bun run build

      - name: Publish to npm
        run: |
          npm pack --ignore-scripts --dry-run --json > npm-pack.json
          node scripts/verify-package-manifest.mjs npm-pack.json
          npm pack --ignore-scripts --json > npm-packed.json
          PACKAGE_ARCHIVE=$(node -p "JSON.parse(require('fs').readFileSync('npm-packed.json', 'utf8'))[0].filename")
          INSTALL_CHECK_DIR=$(mktemp -d)
          trap 'rm -rf "$INSTALL_CHECK_DIR"' EXIT
          npm install --prefix "$INSTALL_CHECK_DIR" "$PWD/$PACKAGE_ARCHIVE" --no-audit --no-fund
          node scripts/verify-installed-cli.mjs "$INSTALL_CHECK_DIR/node_modules/keating"
          npm publish "$PACKAGE_ARCHIVE" --ignore-scripts --provenance --access public

  deploy-web:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Railway
        run: |
          echo "Web deployment handled by Railway GitHub integration"
          echo "Connect the repo at https://railway.app to enable auto-deploy"
