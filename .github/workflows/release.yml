name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd web
          bun install --frozen-lockfile

      - name: Verify tag and synchronized versions
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "${TAG_VERSION}" = "${PACKAGE_VERSION}"
          bun scripts/sync-version.ts --check

      - name: Test and build
        run: |
          bun test ./test/*.test.ts
          cd web
          bun test
          cd ..
          bun run build

      - name: Verify npm package contents
        run: |
          npm pack --ignore-scripts --dry-run --json > npm-pack.json
          node scripts/verify-package-manifest.mjs npm-pack.json

  build:
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: x64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: x64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Build
        run: |
          bun install --frozen-lockfile
          bun scripts/sync-version.ts --check
          bun x tsc -p tsconfig.json
          bun scripts/copy-core-templates.ts

      - name: Create bundle
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          BUNDLE_NAME="keating-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}"
          STAGE_DIR="${BUNDLE_NAME}"
          mkdir -p "${STAGE_DIR}"
          mkdir -p "${STAGE_DIR}/bin"
          cp bin/keating.js "${STAGE_DIR}/bin/"
          cp -r dist pi scripts/install "${STAGE_DIR}/"
          cp package.json "${STAGE_DIR}/"
          # Bundle node_modules so the tarball is truly standalone
          cp -r node_modules "${STAGE_DIR}/"
          mv "${STAGE_DIR}/install/install.sh" "${STAGE_DIR}/install.sh"
          rm -rf "${STAGE_DIR}/install"
          tar -czf "${BUNDLE_NAME}.tar.gz" "${STAGE_DIR}"

      - name: Verify bundle contents
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          BUNDLE_NAME="keating-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}"
          tar -tzf "${BUNDLE_NAME}.tar.gz" > bundle-files.txt
          grep -Fx "${BUNDLE_NAME}/bin/keating.js" bundle-files.txt
          grep -Fx "${BUNDLE_NAME}/dist/src/cli/main.js" bundle-files.txt
          grep -Fx "${BUNDLE_NAME}/dist/src/pi/hyper-teacher/index.js" bundle-files.txt
          ! grep -F "${BUNDLE_NAME}/bin/.keating/" bundle-files.txt
          ! grep -F "${BUNDLE_NAME}/bin/keating.config.json" bundle-files.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keating-${{ matrix.os }}-${{ matrix.arch }}
          path: keating-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node for npm trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Build
        run: |
          bun install --frozen-lockfile
          cd web
          bun install --frozen-lockfile
          cd ..
          bun run build

      - name: Publish to npm
        run: |
          npm pack --ignore-scripts --dry-run --json > npm-pack.json
          node scripts/verify-package-manifest.mjs npm-pack.json
          npm publish --ignore-scripts --provenance --access public

  deploy-web:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Railway
        run: |
          echo "Web deployment handled by Railway GitHub integration"
          echo "Connect the repo at https://railway.app to enable auto-deploy"
