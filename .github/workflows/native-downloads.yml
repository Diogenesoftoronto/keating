name: Native downloads

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      KEATING_ANDROID_KEYSTORE_BASE64:
        required: true
      KEATING_ANDROID_KEYSTORE_PASSWORD:
        required: true
      KEATING_ANDROID_KEY_ALIAS:
        required: true
      KEATING_ANDROID_KEY_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag matching the source version (no tag is moved)
        required: true
        default: v3.15.0
      platform:
        description: Native installers to build
        type: choice
        options: [all, windows, android]
        default: all
      publish:
        description: Attach verified installers to that existing GitHub release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-downloads-${{ github.ref }}-${{ inputs.release_tag }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: false

jobs:
  validate-native-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Verify source version for the requested release
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          bun scripts/sync-version.ts --check
          # shellcheck disable=SC2016
          bun -e '
            const version = (await Bun.file("package.json").json()).version;
            if (!/^\d+\.\d+\.\d+$/.test(version) || process.env.RELEASE_TAG !== `v${version}`) throw new Error("Release tag must match source version");
            await Bun.write(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          '

  build-desktop-windows:
    needs: validate-native-version
    if: ${{ !inputs.platform || inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --cwd spikes/flue-host --frozen-lockfile
          bun install --cwd web --frozen-lockfile
      - name: Build desktop runtime and NSIS installer
        run: |
          bun run --cwd desktop setup:electron
          bun run --cwd desktop build:main
          bun run --cwd desktop dist:windows --publish never
      - name: Install and verify packaged Windows native runtime
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate-native-version.outputs.version }}
        run: |
          $installer = Join-Path $PWD "desktop/release/Keating-$env:RELEASE_VERSION-windows-x64-setup.exe"
          if (!(Test-Path $installer) -or (Get-Item $installer).Length -eq 0) { throw 'Missing Windows installer' }
          $installDir = Join-Path $env:RUNNER_TEMP 'Keating installed'
          $install = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $exe = Join-Path $installDir 'Keating.exe'
          $asar = Join-Path $installDir 'resources/app.asar'
          if (!(Test-Path $exe) -or !(Test-Path (Join-Path $installDir 'resources/nitro/server/index.mjs'))) { throw 'Missing installed application/runtime' }
          $env:ELECTRON_RUN_AS_NODE = '1'
          $smoke = Start-Process -FilePath $exe -ArgumentList @('desktop/scripts/verify-windows-runtime.cjs', "`"$asar`"") -NoNewWindow -PassThru
          if (!$smoke.WaitForExit(60000)) { Stop-Process -Id $smoke.Id -Force; throw 'Packaged native runtime verification timed out' }
          if ($smoke.ExitCode -ne 0) { throw 'Packaged native runtime verification failed' }
          $offline = Join-Path $installDir 'resources/offline/keating-offline.exe'
          & $offline --probe
          if ($LASTEXITCODE -ne 0) { throw 'Installed offline runtime verification failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: keating-desktop-windows-x64
          if-no-files-found: error
          path: desktop/release/Keating-${{ needs.validate-native-version.outputs.version }}-windows-x64-setup.exe

  build-android:
    needs: validate-native-version
    if: ${{ !inputs.platform || inputs.platform == 'all' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_BUNDLE_SPLITTING: '1'
    steps:
      - uses: actions/checkout@v6
      - name: Require the persistent Android signing identity
        env:
          KEYSTORE: ${{ secrets.KEATING_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEATING_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEATING_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEATING_ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "Missing Android release signing secret: ${name}" >&2; exit 1; fi
          done
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native build tools and dependencies
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'build-tools;35.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
          bun install --frozen-lockfile
      - name: Build release APK with bundled JavaScript
        env:
          NODE_ENV: production
        run: |
          unset CPATH CPLUS_INCLUDE_PATH C_INCLUDE_PATH LIBRARY_PATH
          bun run --cwd mobile android:apk:release
      - name: Align, sign, and verify release APK
        env:
          RELEASE_VERSION: ${{ needs.validate-native-version.outputs.version }}
          KEYSTORE_BASE64: ${{ secrets.KEATING_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEATING_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEATING_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEATING_ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/keating-release.jks"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p mobile/release
          APK="mobile/release/Keating-${RELEASE_VERSION}-android-universal.apk"
          "$BUILD_TOOLS/zipalign" -P 16 -f 4 mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/keating-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE_PATH" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$APK" "$RUNNER_TEMP/keating-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/keating-apk-badging.txt"
          grep -F "package: name='com.diogenesoftoronto.keating'" "$RUNNER_TEMP/keating-apk-badging.txt"
          grep -F "versionName='${RELEASE_VERSION}'" "$RUNNER_TEMP/keating-apk-badging.txt"
          if grep -q 'application-debuggable' "$RUNNER_TEMP/keating-apk-badging.txt"; then echo 'Release APK is debuggable' >&2; exit 1; fi
          grep -F 'launchable-activity:' "$RUNNER_TEMP/keating-apk-badging.txt"
          unzip -Z1 "$APK" > "$RUNNER_TEMP/keating-apk-files.txt"
          grep -Fx 'assets/index.android.bundle' "$RUNNER_TEMP/keating-apk-files.txt"
          for arch in armeabi-v7a arm64-v8a x86 x86_64; do
            grep -F "lib/${arch}/libreactnative.so" "$RUNNER_TEMP/keating-apk-files.txt"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: keating-android-universal
          if-no-files-found: error
          path: mobile/release/Keating-${{ needs.validate-native-version.outputs.version }}-android-universal.apk

  publish-windows:
    needs: build-desktop-windows
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: keating-desktop-windows-x64
          path: installers
      - name: Attach Windows installer to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" --json tagName
          gh release upload "$RELEASE_TAG" installers/*.exe

  publish-android:
    needs: build-android
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: keating-android-universal
          path: installers
      - name: Attach Android APK to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" --json tagName
          gh release upload "$RELEASE_TAG" installers/*.apk
